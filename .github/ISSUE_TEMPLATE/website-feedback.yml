name: Website feedback
description: VIUK-Light公式サイトの表示、文章、リンク、アクセシビリティについて報告する
title: "[Website]: "
labels: ["website"]
body:
  - type: markdown
    attributes:
      value: |
        個人情報、APIキー、会話内容、非公開URLは入力しないでください。
  - type: dropdown
    id: category
    attributes:
      label: 種類
      options:
        - 表示・操作
        - モバイル表示
        - 文章・翻訳
        - リンク・公開情報
        - アクセシビリティ
        - 改善提案
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 対象ページ
      placeholder: https://viuk-light.org/...
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 起きていること
      description: 何が分かりにくいか、期待する状態、再現手順を記入してください。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 使用した端末、OS、ブラウザ、画面幅が分かれば記入してください。
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 個人情報や秘密情報を含めていません。
          required: true
